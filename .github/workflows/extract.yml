name: Extract Group URLs

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # allow manual "Run workflow" trigger

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install extractor dependencies
        run: pip install -r extractor/requirements.txt

      - name: Run extractor
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
        working-directory: extractor
        run: python extract.py

      - name: Set up Node (for wrangler)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Push urls.json into Cloudflare KV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          wrangler kv key put "urls" \
            --path extractor/output/urls.json \
            --namespace-id "${{ secrets.CF_KV_NAMESPACE_ID }}" \
            --remote

      - name: Upload artifact (backup copy)
        uses: actions/upload-artifact@v4
        with:
          name: urls-json
          path: extractor/output/urls.json
